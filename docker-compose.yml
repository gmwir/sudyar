services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sudyar}
      POSTGRES_DB: ${POSTGRES_DB:-sudyar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sudyar}"]
      interval: 5s
      retries: 10

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy

  # Buy Box radar. DISABLED until you enable it:  docker compose --profile radar up -d
  radar:
    profiles: ["radar"]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
    command: ["sh", "-c", "until alembic upgrade head; do sleep 5; done; python -m sudyar radar-run"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
