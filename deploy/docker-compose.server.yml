# Server add-on. Use together with the main file, from the repo folder:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.server.yml up -d --build
# Adds: Caddy (HTTPS on 80/443), server mode for the web UI (password + HTTPS-only cookie required),
# and a daily database backup into ./backups (kept 14 days). The web port stays on the server's 127.0.0.1.

services:
  web:
    environment:
      POSTGRES_HOST: db
      WEB_ALLOW_CONTAINER_BIND: "1"
      SUDYAR_SERVER: "1"
      WEB_HTTPS_ONLY_COOKIE: "1"
      WEB_TRUSTED_PROXIES: "172.31.250.10"
    networks:
      - default
      - edge

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    environment:
      SUDYAR_DOMAIN: ${SUDYAR_DOMAIN:?Set SUDYAR_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      - web
    networks:
      edge:
        ipv4_address: 172.31.250.10

  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-sudyar}
      PGDATABASE: ${POSTGRES_DB:-sudyar}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./backups:/backups
    command:
      - sh
      - -c
      - |
        while true; do
          f=/backups/sudyar-$$(date +%Y-%m-%d).dump
          if pg_dump -Fc -f "$$f.tmp"; then mv "$$f.tmp" "$$f"; echo "backup ok: $$f"; else rm -f "$$f.tmp"; echo "backup FAILED"; fi
          find /backups -name 'sudyar-*.dump' -mtime +14 -delete
          sleep 86400
        done
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      db:
        condition: service_healthy

networks:
  edge:
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  caddy_data:
  caddy_config:
